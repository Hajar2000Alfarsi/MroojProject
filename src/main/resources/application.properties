spring.application.name=mroojBE

# ===================================
# Database Configuration
# ===================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mrooj_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:mrooj_user}
spring.datasource.password=${DB_PASSWORD:MroojDB@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / Hibernate Rules
# ===================================
# نستخدم validate بدلاً من update لتفادي التعارض مع Flyway
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================
# Flyway Migration Configuration
# ===================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================
# Server Configuration
# ===================================
server.port=${SERVER_PORT:8080}