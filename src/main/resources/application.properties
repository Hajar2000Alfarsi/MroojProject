spring.application.name=mroojBE

# ===================================
# Database Configuration
# ===================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/mrooj_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:mrooj_user}
spring.datasource.password=${DB_PASSWORD:MroojRoot@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / Hibernate Configuration
# ===================================
# Use validate instead of update to avoid conflicts with Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================
# Flyway Migration Configuration
# ===================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================
# Server Configuration
# ===================================
server.port=${SERVER_PORT:8080}

# ===================================
# JWT Configuration
# ===================================
jwt.secret=${JWT_SECRET:MroojDevelopmentJWTSecretKey2026ChangeBeforeProduction123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================
# Symptom Image Uploads
# ===================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads}