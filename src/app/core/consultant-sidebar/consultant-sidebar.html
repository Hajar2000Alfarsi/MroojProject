<aside class="sidebar">


  <div class="brand">

    <h2 class="brand-name">
      {{ 'consultant.sidebar.brandName' | translate }}
    </h2>


    <p class="brand-subtitle">
      {{ 'consultant.sidebar.brandSubtitle' | translate }}
    </p>

  </div>



  <nav class="nav-list">


    @for(item of items; track item.link){

      <a
        [routerLink]="item.link"
        routerLinkActive="active"
        class="nav-item">


        <span class="nav-label">
          {{ item.name | translate }}
        </span>


      </a>

    }


  </nav>




  <div class="sidebar-bottom">

    <button
      type="button"
      class="logout-btn"
      (click)="logout()">


      <span class="nav-label">
        {{ 'consultant.sidebar.logout' | translate }}
      </span>


    </button>

  </div>


</aside>
